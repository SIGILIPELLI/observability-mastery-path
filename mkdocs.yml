site_name: Observability Mastery Path
site_description: A free Observability course — Prometheus, PromQL, Grafana dashboards, alerting, OpenTelemetry, and SLOs.
site_url: https://sigilipelli.github.io/observability-mastery-path/
repo_url: https://github.com/sigilipelli/observability-mastery-path
repo_name: observability-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Metrics & Prometheus Fundamentals":
      - Overview: level-1/index.md
      - "01 · What Observability Actually Means: Metrics, Logs & Traces": level-1/01-what-observability-means.md
      - "02 · The Prometheus Data Model: Time Series, Labels & Samples": level-1/02-prometheus-data-model.md
      - "03 · Instrumenting an App: Counters, Gauges, Histograms & Summaries": level-1/03-instrumenting-metric-types.md
      - "04 · Scraping: Targets, Service Discovery & Pull vs Push": level-1/04-scraping-service-discovery.md
      - "05 · PromQL Basics: Selecting & Filtering Time Series": level-1/05-promql-basics.md
      - "06 · PromQL Aggregation: sum, rate() & Why Counters Need It": level-1/06-promql-aggregation-rate.md
      - "07 · Histogram Quantiles: Why You Can't Average a Histogram": level-1/07-histogram-quantiles.md
      - "08 · Recording Rules: Pre-Computing Expensive Queries": level-1/08-recording-rules.md
      - "09 · Prometheus Storage: the TSDB on Disk & Retention": level-1/09-prometheus-storage-tsdb.md
